<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> The Project Moon Library </title>
    <style>
      body {
        margin: 0;
        background-image: url("./assets/images/Inside the Library 2.png");
        background-size:cover;
        background-position: center;
        background-repeat: no-repeat;

        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1{
        margin-top: 50px;
        color:white;
        font-size: 64px;
        text-shadow: 3px 3px 8px black;
      }

      .games{
        margin-top: 100px;
        display: flex;
        gap: 60px;
      }

      .books{
        width: 180px;
        height: 420px;
        background:rgba(255,255,255,0.8);
        border-radius: 6px;
        text-decoration: none;
        color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        font-weight: bold;
        transition:.25s;
        clip-path:polygon(0 0, 100% 10%, 100% 100%, 0 100%);
        position:relative;
        overflow:hidden;
      }

      .books:hover{
        transform: translateY(-15px);
        background: white;
      }

      .books:hover .book-portrait{
        transform: translateY(-20px);
      }

      .book-bg{
        position: absolute;
        inset:0;
        width:100%;
        height:100%;

        object-fit: cover;
      }

      .book-portrait{
        position: absolute;
        bottom: 0;
        width: 100%;
        transition:.25s;
      }
      

    </style>
  </head>

  <body>
    <h1> The Library 2 </h1>

    <div class="games">
      <a class="books" href="./gamesies/LC.html">

        <img class="book-bg" src="./assets/covers/Lobotomy Corporation.png">

        <img class="book-portrait" src="./assets/images/Angela1.png">
        
      </a>

       <div class="games">
      <a class="books" href="./gamesies/LOR.html">

        <img class="book-bg" src="./assets/covers/Library Of Ruina.png">

        <img class="book-portrait" src="./assets/images/Angela2.png">
      </a>

       <div class="games">
      <a class="books" href="./gamesies/LCB.html">

       <img class="book-bg" src="./assets/covers/Limbus Company.png">

        <img class="book-portrait" src="./assets/images/Dante.png">
      </a>

    </div>

  </body>
</html>
