<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> The Project Moon Library </title>
    <style>
      body {
        margin: 0;
        background-image: url("./assets/images/Inside the Library 2.png");
        background-size:cover;
        background-position: center;
        background-repeat: no-repeat;

        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1{
        margin-top: 50px;
        color:white;
        font-size: 64px;
        text-shadow: 3px 3px 8px black;
      }

      .games{
        margin-top: 100px;
        display: flex;
        gap: 60px;
      }

      .game{
        width:180px;
        display:flex;
        flex-direction:column;
        align-items:center;
      }

      .books{
        width: 260px;
        height: 520px;
        background:rgba(255,255,255,0.8);
        border-radius: 6px;
        text-decoration: none;
        color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        font-weight: bold;
        transition:.25s;
        position:relative;
        overflow:hidden;
      }

      .left-book{
        clip-path: polygon(0 22%, 100 0, 100% 100%, 0 100%);
      }

      .middle-book{
        clip-path: polygon(50% 0, 100% 12%, 100% 100%, 0 100%, 0 12%);
      }

      .right-book{
        clip-path: polygon(0 0, 100% 22%, 100% 100%, 0 100%);
      }

      .books:hover{
        transform: translateY(-15px);
        background: white;
      }

      .books:hover .book-portrait{
        transform: translateY(-20px);
      }

      .book-bg{
        position: absolute;
        inset:0;
        width:100%;
        height:100%;

        object-fit: cover;
      }

      .book-portrait{
        position: absolute;
        bottom: 0;
        width: 100%;
        transition:.25s;
      }

      .book-portrait-left{
        position: absolute;
        left: -10px;
        bottom: 0;
        height: 95%;
      }

      .book-portrait-right{
        position: absolute;
        right: -10px;
        bottom: 0;
        height: 95%;
      }

      .books:hover .book-portrait-left, .books:hover .book-portrait-right{
        transform:translateY(-20px);
      }
      .game-title{
        margin-top:15px;
        color:white;
        font-size:26px;
        text-align:center;
        text-shadow: 0 0 10px black;
      }

      .game-logo{
        width:140px;
        margin-top:8px;
        opacity:.6;
        transition:.25s;
      }
      
      .center-game{
        margin-top: -80px;
      }
      .center-game .books{
        width: 340px;
      }

    </style>
  </head>

  <body>
    <h1> The Library 2 </h1>

    <div class="games">

      <div class="game">

        <a class="books left-book" href="./gamesies/LC.html">

          <img class="book-bg" src="./assets/covers/Lobotomy Corporation.png">

          <img class="book-portrait" src="./assets/images/Angela1.png">
       </a>

          <div class="game-title">
            Lobotomy Corporation
            <img class="game-logo" src="./assets/logos/LobotomyLogo.png"> 
          </div> 

          
      </div> 
    
      <div class="game center-game">

        <a class="books middle-book" href="./gamesies/LOR.html">

          <img class="book-bg" src="./assets/covers/Library Of Ruina.png">

          <img class="book-portrait-right" src="./assets/images/Angela2.png">
          <img class="book-portrait-left" src="./assets/images/Roland1.png">
        </a>

          <div class="game-title">
            Library of Ruina
             <img class="game-logo" src="./assets/logos/LibraryLogo.png"> 
          </div> 

         
      </div>

      <div class="game">

       <a class="books right-book" href="./gamesies/LCB.html">

          <img class="book-bg" src="./assets/covers/Limbus Company.png">

          <img class="book-portrait" src="./assets/images/Dante.png">
        </a>

         <div class="game-title">
            Limbus Company
           <img class="game-logo" src="./assets/logos/LimbusLogo.png"> 
          </div> 

            
      </div>
    </div>

  </body>
</html>
